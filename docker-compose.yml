# OpenHR · despliegue con Docker Compose
#   cp .env.example .env   (y cambia los secretos)
#   docker compose up -d --build
# Web: http://localhost:3000 · Correo de pruebas (Mailpit): http://localhost:8025

name: openhr

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openhr}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-openhr_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Define POSTGRES_OWNER_PASSWORD en .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplica las migraciones con el rol propietario y termina.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/db/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_OWNER_USER:-openhr_owner}:${POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-openhr}
      OPENHR_APP_DB_PASSWORD: ${OPENHR_APP_DB_PASSWORD:?Define OPENHR_APP_DB_PASSWORD en .env}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # La API usa el rol sin privilegios, sujeto a RLS.
      DATABASE_URL: postgres://openhr_app:${OPENHR_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-openhr}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      STORAGE_DIR: /data/storage
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-OpenHR <no-reply@openhr.local>}
      TZ: UTC
    volumes:
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }

  # Servidor SMTP de pruebas: captura todos los correos. En producción, quítalo y
  # configura SMTP_HOST con tu proveedor real.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
  storage:
