# Base de datos efímera para los tests de integración de la API:
#   docker compose -f docker-compose.test.yml up -d
#   npm test
name: openhr-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openhr_test
      POSTGRES_USER: openhr_owner
      POSTGRES_PASSWORD: openhr_owner
      TZ: UTC
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
