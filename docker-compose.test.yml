# Base de datos efímera para los tests de integración de la API:
#   docker compose -f docker-compose.test.yml up -d
#   npm test
name: openhr-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openhr_test
      POSTGRES_USER: openhr_owner
      POSTGRES_PASSWORD: openhr_owner
      TZ: UTC
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # Almacenamiento compatible con S3 y emulador de Azure Blob para los tests de adaptadores.
  s3:
    image: adobe/s3mock:latest
    environment:
      initialBuckets: openhr-test
    ports:
      - "127.0.0.1:9100:9090"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "127.0.0.1:10000:10000"
